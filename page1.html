<!DOCTYPE html>

<html>
<head>

    <title>Project</title>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
    <body>
        <style>

            body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background-color: #fefefe;
      color: #333;
      line-height: 1.6;
      padding-left: 200px;
      position: relative;
    }
    header {
      background: #f0f0f0;
      text-align: center;
      padding: 1rem 0;
    }

    footer {
      background: #f0f0f0;
      text-align: center;
      padding: 1rem 0;
      position: fixed;
      bottom: 0;
      width: calc(100% - 200px);
      width: 100%;
      right:0;
      z-index: 10;
    }
    main {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
      padding-bottom: 80px;
    }
           
.navbar {
  position: fixed;
  top: 0;
  left: 0; 
  height: 100vh;
  width: 200px;
  background: #333;
  display: flex;
  flex-direction: column; /* Stacks vertically */
  padding: 2rem;
}

.navbar a {
  padding: 0.5rem 1rem;
  text-decoration: none;
  color: #ffffff;
  border-radius: 4px;
  transition: background 0.3s;
  margin-bottom: 0.5rem;
}

.navbar a:hover {
  background: #a5a6a6;
  color: white;
}

        </style>
<header></header>


<nav class="navbar">
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="#">Contact</a>
</nav>

<footer><p><strong>&copy; 2025 Chyrva</strong></p>
</footer>
    </body>
</html>
